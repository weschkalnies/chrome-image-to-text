name: Release

# Laeuft, wenn ein Versions-Tag (v*) gepusht wird. Tags entstehen lokal mit
# `npm run release -- <patch|minor|major|X.Y.Z>` und werden mit
# `git push --follow-tags` hochgeladen.
# Die Version kommt aus src/manifest.json und muss zum Tag passen.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag und Manifest-Version abgleichen
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(jq -r .version src/manifest.json)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG passt nicht zur Manifest-Version $VERSION."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Extension bauen und pruefen (src/ -> deploy/)
        run: |
          node tools/build.js
          node tools/build.js --check

      - name: Extension zippen (nur Runtime-Dateien)
        run: |
          set -euo pipefail
          OUT="localocr-screen-to-text-v${VERSION}.zip"
          (cd deploy && zip -r "../$OUT" . -x '*.md')
          echo "ZIP=$OUT" >> "$GITHUB_ENV"

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ env.ZIP }}
