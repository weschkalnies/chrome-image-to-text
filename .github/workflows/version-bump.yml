name: Auto Version Bump

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    # Skip, wenn der Commit selbst vom Bump-Workflow kommt ([skip ci])
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version erhöhen und Tag setzen
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CURRENT=$(jq -r '.version' deploy/manifest.json)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          TAG="v$NEW"

          # Falls der Tag schon existiert (z. B. Re-Run), nicht erneut bumpen
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG existiert bereits – kein Bump nötig."
            exit 0
          fi

          echo "Bump: $CURRENT -> $NEW"

          for f in deploy/manifest.json ocr-extension/manifest.json; do
            jq --arg v "$NEW" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

          git add deploy/manifest.json ocr-extension/manifest.json
          git commit -m "chore(release): bump version to $NEW [skip ci]"
          git tag "$TAG"
          git push origin main --tags
