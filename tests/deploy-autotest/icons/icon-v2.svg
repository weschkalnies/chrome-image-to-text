<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title>Local Screen OCR</title>
  <!-- Two-color master: dark blue scan surface and a white text document. -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#12314D"/>
  <path d="M72 40h92l28 28v132c0 11-9 20-20 20H72c-11 0-20-9-20-20V60c0-11 9-20 20-20Z" fill="#FFFFFF"/>
  <!-- Folded document corner. -->
  <path d="M164 40v28h28Z" fill="#12314D"/>
  <!-- Bold T: OCR/text remains legible at toolbar sizes. -->
  <path d="M86 78c0-5 4-9 9-9h54c5 0 9 4 9 9s-4 9-9 9h-18v32c0 5-4 9-9 9s-9-4-9-9V87H95c-5 0-9-4-9-9Z" fill="#12314D"/>
  <!-- Three text lines, intentionally wide and high contrast. -->
  <rect x="84" y="145" width="76" height="13" rx="6.5" fill="#12314D"/>
  <rect x="84" y="169" width="76" height="13" rx="6.5" fill="#12314D"/>
  <rect x="84" y="193" width="50" height="13" rx="6.5" fill="#12314D"/>
</svg>
